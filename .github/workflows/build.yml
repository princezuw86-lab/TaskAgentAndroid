name: TASK AI AGENT V4 Diagnostic

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        run: |
          wget https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip gradle-8.9-bin.zip
          echo "$PWD/gradle-8.9/bin" >> $GITHUB_PATH

      - name: Create Android project
        run: |
          mkdir -p app/src/main/java/com/taskagent/app

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = 'TaskAgentAndroid'
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.taskagent.app'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.taskagent.app'
                  minSdk 23
                  targetSdk 35
                  versionCode 4
                  versionName '4.0'
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <application
                  android:theme="@android:style/Theme.Material.Light.NoActionBar"
                  android:label="TASK AI AGENT V4"
                  android:usesCleartextTraffic="false">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/taskagent/app/MainActivity.java <<'EOF'
          package com.taskagent.app;

          import android.app.Activity;
          import android.os.Bundle;
          import android.graphics.Color;
          import android.view.Gravity;
          import android.view.View;
          import android.widget.*;
          import android.webkit.*;
          import org.json.JSONTokener;

          public class MainActivity extends Activity {

              WebView web;
              EditText urlBox;
              TextView status, result;
              Button openButton, analyzeButton;
              String logs = "";

              void log(String message) {
                  logs = message + "\n" + logs;
                  if (logs.length() > 6000) {
                      logs = logs.substring(0, 6000);
                  }
                  result.setText(logs);
              }

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(12,12,12,12);
                  root.setBackgroundColor(Color.rgb(15,23,42));

                  TextView title = new TextView(this);
                  title.setText("TASK AI AGENT - V4");
                  title.setTextSize(21);
                  title.setTextColor(Color.WHITE);
                  title.setGravity(Gravity.CENTER);
                  root.addView(title);

                  urlBox = new EditText(this);
                  urlBox.setSingleLine(true);
                  urlBox.setText("https://pr.social");
                  urlBox.setTextColor(Color.BLACK);
                  urlBox.setBackgroundColor(Color.WHITE);
                  root.addView(urlBox);

                  openButton = new Button(this);
                  openButton.setText("فتح الموقع");
                  root.addView(openButton);

                  status = new TextView(this);
                  status.setTextColor(Color.rgb(134,239,172));
                  status.setText("جاهز");
                  status.setPadding(4,8,4,8);
                  root.addView(status);

                  analyzeButton = new Button(this);
                  analyzeButton.setText("تحليل واستخراج نص الصفحة");
                  root.addView(analyzeButton);

                  result = new TextView(this);
                  result.setTextColor(Color.WHITE);
                  result.setTextSize(12);
                  result.setText("سجل التشخيص سيظهر هنا.");
                  result.setPadding(6,6,6,6);

                  ScrollView logScroll = new ScrollView(this);
                  logScroll.addView(result);
                  root.addView(logScroll,
                      new LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT, 160));

                  web = new WebView(this);
                  web.setBackgroundColor(Color.WHITE);

                  WebSettings settings = web.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setLoadsImagesAutomatically(true);
                  settings.setJavaScriptCanOpenWindowsAutomatically(true);
                  settings.setSupportMultipleWindows(false);
                  settings.setUseWideViewPort(true);
                  settings.setLoadWithOverviewMode(true);

                  CookieManager cookies = CookieManager.getInstance();
                  cookies.setAcceptCookie(true);
                  cookies.setAcceptThirdPartyCookies(web, true);

                  web.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public boolean onConsoleMessage(ConsoleMessage message) {
                          log("JS " + message.messageLevel() + ": " +
                              message.message() + " (line " +
                              message.lineNumber() + ")");
                          return true;
                      }
                  });

                  web.setWebViewClient(new WebViewClient() {

                      @Override
                      public void onPageStarted(WebView view, String url,
                                               android.graphics.Bitmap favicon) {
                          status.setText("بدأ التحميل: " + url);
                          log("بدأ تحميل: " + url);
                      }

                      @Override
                      public void onPageFinished(WebView view, String url) {
                          status.setText("انتهى تحميل الصفحة: " + url);
                          log("انتهى تحميل الصفحة الرئيسية.");
                          view.evaluateJavascript(
                              "(function(){return document.readyState})()",
                              value -> log("حالة المستند: " + value));
                      }

                      @Override
                      public boolean shouldOverrideUrlLoading(
                          WebView view, WebResourceRequest request) {
                          return false;
                      }

                      @Override
                      public void onReceivedError(
                          WebView view, WebResourceRequest request,
                          WebResourceError error) {
                          if (request.isForMainFrame()) {
                              status.setText("خطأ في الصفحة الرئيسية");
                              log("خطأ: " + error.getDescription());
                          }
                      }

                      @Override
                      public void onReceivedHttpError(
                          WebView view, WebResourceRequest request,
                          WebResourceResponse response) {
                          log("HTTP " + response.getStatusCode() +
                              " : " + request.getUrl());
                      }
                  });

                  root.addView(web, new LinearLayout.LayoutParams(
                      LinearLayout.LayoutParams.MATCH_PARENT, 0, 1));

                  openButton.setOnClickListener(v -> {
                      String url = urlBox.getText().toString().trim();
                      if (!url.startsWith("https://") &&
                          !url.startsWith("http://")) {
                          url = "https://" + url;
                      }
                      logs = "";
                      result.setText("");
                      web.loadUrl(url);
                  });

                  analyzeButton.setOnClickListener(v -> {
                      status.setText("جارٍ تحليل الصفحة...");
                      log("طلب تحليل الصفحة...");
                      web.evaluateJavascript(
                          "(function(){return JSON.stringify({url:location.href,title:document.title,ready:document.readyState,text:document.body?document.body.innerText:'',htmlLength:document.documentElement?document.documentElement.innerHTML.length:0})})()",
                          value -> {
                              try {
                                  Object parsed = new JSONTokener(value).nextValue();
                                  String data = String.valueOf(parsed);
                                  log("نتيجة تحليل الصفحة:\n" + data);
                                  status.setText("انتهى التحليل");
                              } catch (Exception e) {
                                  log("خطأ في قراءة النتيجة: " + value);
                                  status.setText("خطأ في التحليل");
                              }
                          });
                  });

                  setContentView(root);
              }
          }
          EOF

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TaskAgentAPK-V4
          path: app/build/outputs/apk/debug/app-debug.apk
          
